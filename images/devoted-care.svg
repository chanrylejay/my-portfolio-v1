<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1330"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- faint schedule grid motif -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="190" x2="800" y2="190"/>
    <line x1="0" y1="260" x2="800" y2="260"/><line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="130" y1="90" x2="130" y2="500"/><line x1="260" y1="90" x2="260" y2="500"/>
    <line x1="390" y1="90" x2="390" y2="500"/><line x1="520" y1="90" x2="520" y2="500"/>
    <line x1="650" y1="90" x2="650" y2="500"/>
  </g>
  <!-- shift blocks -->
  <rect x="145" y="200" width="220" height="46" rx="8" fill="#2563EB" opacity="0.85"/>
  <rect x="405" y="270" width="160" height="46" rx="8" fill="#15803D" opacity="0.75"/>
  <rect x="275" y="340" width="240" height="46" rx="8" fill="#7C3AED" opacity="0.6"/>
  <rect x="540" y="200" width="150" height="46" rx="8" fill="#DC2626" opacity="0.55"/>
  <rect x="145" y="410" width="170" height="46" rx="8" fill="#0E7490" opacity="0.6"/>
  <!-- heart mark -->
  <path d="M 84 96 c -10 -14 -34 -12 -40 6 c -5 15 6 26 40 50 c 34 -24 45 -35 40 -50 c -6 -18 -30 -20 -40 -6 z"
        fill="#F87171"/>
  <text x="140" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">Devoted Care</text>
  <rect x="142" y="146" width="330" height="6" rx="3" fill="url(#bar)"/>
  <text x="142" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#BFDBFE">Scheduling Intelligence Platform</text>
  <text x="655" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#93C5FD" opacity="0.8">private client system</text>
</svg>
